name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: python -m pip install '.[dev]'
      - run: python -m unittest discover -s tests -v
      - run: ruff check .
      - run: ruff format --check .
      - run: rea-aegis --version
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install setuptools==84.2.1
      - run: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist
      - run: python -c "from setuptools.build_meta import build_sdist; build_sdist('dist')"
      - run: python -m pip install --no-deps --target /tmp/rea-aegis-installed dist/*.whl
      - name: Verify installed package outside the checkout
        working-directory: /tmp
        env:
          PYTHONPATH: /tmp/rea-aegis-installed
        run: python -m rea_aegis --version
