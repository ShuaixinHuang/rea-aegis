name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: python -m pip install '.[dev]'
      - run: python -m unittest discover -s tests -v
      - run: ruff check .
      - run: ruff format --check .
      - run: rea-aegis --version
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: python -m pip install setuptools==84.2.1
      - name: Build source distribution
        run: python -c "from setuptools.build_meta import build_sdist; build_sdist('dist')"
      - name: Build wheel from the source distribution
        run: python -m pip wheel dist/*.tar.gz --no-deps --no-build-isolation --wheel-dir dist
      - name: Install the wheel
        run: python -m pip install --no-deps --target /tmp/rea-aegis-installed dist/*.whl
      - name: Verify installed package outside the checkout
        working-directory: /tmp
        env:
          PYTHONPATH: /tmp/rea-aegis-installed
        run: |
          python -m rea_aegis --version
          "$PYTHONPATH/bin/rea-aegis" --version
          python "$GITHUB_WORKSPACE/scripts/smoke_installed.py"
